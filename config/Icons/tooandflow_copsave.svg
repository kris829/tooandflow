<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- tooandflow COP Flipsave icon — 16x16 pixel art.
       Sibling of tooandflow_flipsave.svg: same film frame + floppy badge,
       but the play triangle is Copernicus-orange and a two-node wire sits
       under it (it renders COP nodes, not the viewport).
       One <rect> per pixel block so edges stay hard at any raster scale. -->

  <!-- ===== film frame outer body (dark slate), cols 1..14 rows 1..14 ===== -->
  <rect x="1" y="1" width="14" height="14" fill="#222633"/>

  <!-- ===== inner screen panel (steel blue), cols 4..11 rows 3..12 ===== -->
  <rect x="4" y="3" width="8" height="9" fill="#3c4f6b"/>

  <!-- ===== sprocket holes in the gutters (cream) ===== -->
  <g fill="#f4ecd8">
    <!-- left gutter at x=2 -->
    <rect x="2" y="2"  width="1" height="1"/>
    <rect x="2" y="5"  width="1" height="1"/>
    <rect x="2" y="8"  width="1" height="1"/>
    <rect x="2" y="11" width="1" height="1"/>
    <!-- right gutter at x=13 -->
    <rect x="13" y="2"  width="1" height="1"/>
    <rect x="13" y="5"  width="1" height="1"/>
    <rect x="13" y="8"  width="1" height="1"/>
    <rect x="13" y="11" width="1" height="1"/>
  </g>

  <!-- ===== play triangle (Copernicus orange), rows 4..9, same shape as
       the flipsave ▶ so the family reads together on the shelf ===== -->
  <g fill="#ff9d5c">
    <rect x="6"  y="4" width="1" height="6"/>  <!-- back edge, full height -->
    <rect x="7"  y="5" width="1" height="4"/>
    <rect x="8"  y="6" width="1" height="2"/>  <!-- tip -->
  </g>
  <!-- triangle highlight on the leading (back) edge -->
  <g fill="#ffd2ae">
    <rect x="6" y="4" width="1" height="1"/>
    <rect x="6" y="9" width="1" height="1"/>
  </g>

  <!-- ===== two-node wire motif (cyan nodes, grey wire), row 10 =====
       sits under the triangle, left of the floppy badge -->
  <rect x="5" y="10" width="1" height="1" fill="#6cd6ff"/>
  <rect x="6" y="10" width="1" height="1" fill="#8a93a8"/>
  <rect x="7" y="10" width="1" height="1" fill="#6cd6ff"/>

  <!-- ===== floppy-disk "save" badge, bottom-right (identical to flipsave) ===== -->
  <rect x="9" y="10" width="4" height="4" fill="#2f6fd0"/>
  <!-- clipped top-left corner pixel (floppy notch) -->
  <rect x="9" y="10" width="1" height="1" fill="#222633"/>
  <!-- metal shutter (top strip) -->
  <rect x="11" y="10" width="1" height="2" fill="#bcd0ff"/>
  <!-- white label (bottom) -->
  <rect x="10" y="12" width="2" height="1" fill="#f4ecd8"/>

  <!-- ===== frame edge outline (darkest), drawn last so it sits on top ===== -->
  <g fill="#15171f">
    <rect x="1"  y="1"  width="14" height="1"/>  <!-- top -->
    <rect x="1"  y="14" width="14" height="1"/>  <!-- bottom -->
    <rect x="1"  y="1"  width="1"  height="14"/> <!-- left -->
    <rect x="14" y="1"  width="1"  height="14"/> <!-- right -->
  </g>
</svg>
